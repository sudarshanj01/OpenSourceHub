version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utility-app
    restart: unless-stopped
    ports:
      # Local development port mapping:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/app.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

