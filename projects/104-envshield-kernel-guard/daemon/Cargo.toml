[package]
name = "envshield"
version = "0.2.0"
edition = "2021"
description = "Sovereign In-Memory Secret Vault & AI Agent DLP"
authors = ["OpenSourceHub Community"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.3"
colored = "2.1"
zeroize = { version = "1.8", features = ["derive"] }
which = "8.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
