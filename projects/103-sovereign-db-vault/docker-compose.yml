services:
  vaultengine-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultengine-web
    restart: unless-stopped
    ports:
      - "${PORT:-3103}:3103"
    environment:
      - NODE_ENV=production
      - PORT=3103
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3103/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

