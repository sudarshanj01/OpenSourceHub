services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capflow-app
    restart: unless-stopped
    ports:
      - "3102:3102"
    environment:
      - PORT=3102
      - RUST_LOG=info
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3102/api/recordings || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

