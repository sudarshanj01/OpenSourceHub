[package]
name = "vaultengine"
version = "1.0.0"
edition = "2021"
authors = ["OpenSourceHub Sovereign Team"]
description = "Sovereign Database Continuous Archiving & Point-in-Time Recovery (PITR) Engine"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
colored = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.5"
anyhow = "1.0"
tempfile = "3.12"
