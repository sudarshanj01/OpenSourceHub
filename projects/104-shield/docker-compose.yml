services:
  envshield-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: envshield-web
    restart: unless-stopped
    ports:
      - "${PORT:-3104}:3104"
    environment:
      - PORT=3104
      - NODE_ENV=production

